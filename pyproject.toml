[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framebound"
version = "0.1.0"
description = "Consistency bounds for AI-generated 2D animation: shape, size, movement and appearance checks, model-facing repair tools, human review, and training-data export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.12,<3",
  "Pillow>=13,<14",
  "numpy>=2.4,<3",
  "mcp==2.3.0",
  "fastapi>=0.128",
  "uvicorn>=0.40",
]

[project.optional-dependencies]
export-validation = ["datasets>=3,<6", "pycocotools>=2.0.8"]
test = ["pytest", "pytest-asyncio", "httpx"]

[project.scripts]
framebound = "framebound.cli:main"

[tool.setuptools.packages.find]
include = ["framebound*"]

[tool.setuptools.package-data]
framebound = ["knowledge.json"]
