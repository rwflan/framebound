<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sheet — Framebound</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="desk.css"><script src="desk.js" defer></script></head>
<body class="sheet">
<header class="shell-header"><div class="identity"><a class="logo" href="index.html" aria-label="Framebound"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M10 3H3v7M18 3h7v7M25 18v7h-7M10 25H3v-7"/></svg></a><h1 class="clip-title">Pip / Run<span>r03</span></h1></div><nav class="design-nav" data-nav aria-label="Design candidates"></nav></header>
<main class="sheet-main">
  <section class="exposure" aria-label="Exposure sheet">
    <header class="sheet-table-head"><span>Frame</span><span>Hold</span><span></span></header>
    <div class="sheet-rows" data-sheet></div>
  </section>
  <section class="sheet-preview" aria-label="Animation preview">
    <header class="sheet-preview-head"><span data-count>04 / 08</span><span data-total>32t</span></header>
    <div class="live" data-live></div><div class="bounds-box"></div>
    <span class="sheet-status status" data-status role="status"></span><div class="sheet-progress"></div>
    <footer class="sheet-footer"><div class="controls"><button class="icon-button " aria-label="Previous frame" title="Previous frame" data-icon="prev" data-step="-1"></button><button class="icon-button play" aria-label="Play" title="Play" data-icon="play" data-play></button><button class="icon-button " aria-label="Next frame" title="Next frame" data-icon="next" data-step="1"></button><button class="speed" data-speed aria-label="Playback speed" title="Playback speed">1×</button></div><div class="sheet-actions"><button class="icon-button " aria-label="Toggle bounds" title="Toggle bounds" data-icon="bounds" data-toggle="show-bounds" aria-pressed="false"></button><div class="decision-buttons"><button class="icon-button " aria-label="Request changes" title="Request changes" data-icon="cross" data-decision="reject" aria-pressed="false"></button><button class="icon-button approve" aria-label="Approve" title="Approve" data-icon="check" data-decision="approve" aria-pressed="false"></button></div></div></footer>
  </section>
</main>
</body></html>
