<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clips — Framebound</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="desk.css"><script src="desk.js" defer></script></head>
<body class="clips">
<header class="shell-header"><div class="identity"><a class="logo" href="index.html" aria-label="Framebound"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M10 3H3v7M18 3h7v7M25 18v7h-7M10 25H3v-7"/></svg></a><h1 class="clip-title">Pip / Clips<span>04</span></h1></div><nav class="design-nav" data-nav aria-label="Design candidates"></nav></header>
<main class="clips-grid" aria-label="Clip review queue"><button class="clip-card" data-open-clip="Run" aria-label="Review Run"><span class="card-heading">Run<span>r03</span></span><div class="clip-art" data-art="3" data-clip-art="Run"></div><span class="card-open" data-icon="expand"></span></button><button class="clip-card" data-open-clip="Jump" aria-label="Review Jump"><span class="card-heading">Jump<span>r01</span></span><div class="clip-art" data-art="3" data-clip-art="Jump"></div><span class="card-open" data-icon="expand"></span></button><button class="clip-card" data-open-clip="Idle" aria-label="Review Idle"><span class="card-heading">Idle<span>r02</span></span><div class="clip-art" data-art="1" data-clip-art="Idle"></div><span class="card-open" data-icon="expand"></span></button><button class="clip-card" data-open-clip="Attack" aria-label="Review Attack"><span class="card-heading">Attack<span>r01</span></span><div class="clip-art" data-art="4" data-clip-art="Attack"></div><span class="card-open" data-icon="expand"></span></button></main>
<dialog class="clip-dialog" data-dialog aria-label="Clip review">
  <header class="dialog-header"><h2 class="clip-title" data-clip-label>Run</h2><button class="icon-button " aria-label="Close" title="Close" data-icon="cross" data-close></button></header>
  <div class="dialog-stage"><div class="live" data-live></div><div class="bounds-box"></div></div>
  <footer class="dialog-footer"><div class="controls"><button class="icon-button " aria-label="Previous frame" title="Previous frame" data-icon="prev" data-step="-1"></button><button class="icon-button play" aria-label="Play" title="Play" data-icon="play" data-play></button><button class="icon-button " aria-label="Next frame" title="Next frame" data-icon="next" data-step="1"></button></div><span class="counter" data-count>04 / 08</span><button class="icon-button " aria-label="Mark frame" title="Mark frame" data-icon="pin" data-pin aria-pressed="false"></button><span class="status" data-status role="status"></span><div class="decision-buttons"><button class="icon-button " aria-label="Request changes" title="Request changes" data-icon="cross" data-decision="reject" aria-pressed="false"></button><button class="icon-button approve" aria-label="Approve" title="Approve" data-icon="check" data-decision="approve" aria-pressed="false"></button></div></footer>
  <input type="range" class="scrub" min="0" max="7" value="3" data-scrub aria-label="Animation frame">
</dialog>
</body></html>
