<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas — Framebound</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="desk.css"><script src="desk.js" defer></script></head>
<body class="canvas">
<header class="shell-header"><div class="identity"><a class="logo" href="index.html" aria-label="Framebound"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M10 3H3v7M18 3h7v7M25 18v7h-7M10 25H3v-7"/></svg></a><h1 class="clip-title">Pip / Run<span>r03</span></h1></div><nav class="design-nav" data-nav aria-label="Design candidates"></nav></header>
<main class="canvas-layout">
  <section class="canvas-stage" aria-label="Animation preview">
    <span class="canvas-number" data-current aria-hidden="true">04</span>
    <div class="live" data-live></div><div class="bounds-box"></div>
    <div class="canvas-tools"><button class="icon-button " aria-label="Toggle bounds" title="Toggle bounds" data-icon="bounds" data-toggle="show-bounds" aria-pressed="false"></button><button class="icon-button " aria-label="Mark frame" title="Mark frame" data-icon="pin" data-pin aria-pressed="false"></button></div>
    <div class="canvas-bottom"><div class="controls"><button class="icon-button " aria-label="Previous frame" title="Previous frame" data-icon="prev" data-step="-1"></button><button class="icon-button play" aria-label="Play" title="Play" data-icon="play" data-play></button><button class="icon-button " aria-label="Next frame" title="Next frame" data-icon="next" data-step="1"></button></div><span class="counter" data-count>04 / 08</span></div>
    <span class="status" data-status role="status"></span>
    <div class="canvas-decisions"><div class="decision-buttons"><button class="icon-button " aria-label="Request changes" title="Request changes" data-icon="cross" data-decision="reject" aria-pressed="false"></button><button class="icon-button approve" aria-label="Approve" title="Approve" data-icon="check" data-decision="approve" aria-pressed="false"></button></div></div>
  </section>
  <aside class="vertical-reel" data-frames aria-label="Frames"></aside>
</main>
</body></html>
